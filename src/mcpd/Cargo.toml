[package]
name = "mcpd"
version = "0.1.0"
edition = "2021"
description = "MCP daemon — exposes system tools via JSON-RPC 2.0 over stdio"

[[bin]]
name = "mcpd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
strip = true
