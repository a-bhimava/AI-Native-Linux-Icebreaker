[package]
name = "mcpd"
version = "0.1.0"
edition = "2021"
description = "MCP daemon — exposes system tools via JSON-RPC 2.0 over stdio"

[lib]
name = "mcpd"
path = "src/lib.rs"

[[bin]]
name = "mcpd"
path = "src/main.rs"

[features]
# `fs-test-roots` compiles in the MCPD_FS_TEST_ROOTS env-var read inside
# tools::fs::default_roots(), used by the M1.3 Landlock kernel-enforcement
# integration test to widen userspace validation while leaving Landlock
# unchanged. Production release builds must NOT set this — verifying with
# `strings target/release/mcpd | grep MCPD_FS_TEST_ROOTS` should return empty.
fs-test-roots = []

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v6.9 Scope O Layer 2 Part B (2026-07-14): runtime YAML manifest loader.
# Manifests live in `src/mcpd/manifests/*.yaml` and are read at daemon
# startup; the loader validates each against a hardcoded meta-schema
# and rejects any that fails, so a malformed manifest can never expose
# an untested tool. serde_yaml is the lightest option that plays with
# our existing serde derives.
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
libc = "0.2"
jsonschema = { version = "0.18", default-features = false }
nix = { version = "0.28", features = ["fs", "net"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
zbus = { version = "4", default-features = false, features = ["tokio"] }
sd-notify = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
