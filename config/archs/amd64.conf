# config/archs/amd64.conf — variables for x86_64 (amd64) ISO builds.
#
# Sourced by every arch-aware build script (build-base.sh, build-iso.sh,
# qemu-gate.sh, mcpd-harvest.sh, v*.manifest). Do not add code here —
# just variables. Anything not present here defaults to the historical
# amd64-hardcoded behavior for backwards compatibility with V0–V6.51.

# ── Debian/Ubuntu architecture tag ──
# Used by: debootstrap --arch=, dpkg-architecture, ubuntu-ports vs archive.
ARCH=amd64

# ── Rust target triple ──
# Used by: cargo build --target=, cross build.
RUST_TRIPLE=x86_64-unknown-linux-gnu

# ── GRUB EFI format + boot filename ──
# grub-mkstandalone --format decides which architecture's EFI stub GRUB
# emits. BOOTX64.EFI is the UEFI-defined default name on amd64.
GRUB_FORMAT=x86_64-efi
EFI_BOOT_NAME=BOOTX64.EFI

# ── QEMU emulator + machine + firmware ──
# amd64 uses the default q35 machine + the ISO's own GRUB (no external
# firmware needed). QEMU_MACHINE empty → default.
QEMU_BIN=qemu-system-x86_64
QEMU_MACHINE=""
QEMU_FW_ARGS=""
QEMU_CPU_TCG="max"

# ── APT mirror ──
# amd64 is a primary architecture; lives on archive.ubuntu.com.
# (arm64 lives on ports.ubuntu.com.)
APT_MIRROR=http://archive.ubuntu.com/ubuntu

# ── llama.cpp cmake flags + build directory ──
# F-24 rules: portable-x86 build. AVX2 enabled (Haswell 2013+ minimum),
# AVX-512 disabled (Rosetta 2 doesn't support it → SIGILL). See F-36 rule
# R10 for the CPU support window rationale.
LLAMA_CMAKE_FLAGS="-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_AVX512=OFF -DGGML_FMA=ON -DGGML_F16C=ON"
LLAMA_BUILD_DIR=build-portable

# ── ISO boot mode ──
# hybrid: isolinux (BIOS) + GRUB (UEFI) — amd64's traditional dual path.
# uefi-only: skip isolinux, UEFI only (arm64 has no BIOS concept).
BOOT_MODE=hybrid
