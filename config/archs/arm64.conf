# config/archs/arm64.conf — variables for aarch64 (arm64) ISO builds.
#
# Sourced by every arch-aware build script. Do not add code here — just
# variables. See config/archs/amd64.conf for the amd64 counterpart.
#
# arm64 is the primary target for Apple Silicon UTM in "Virtualize" mode
# (Virtualization.framework, native arm64 speed on M-series chips). The
# alternative — running amd64 ISOs under UTM Emulate + Rosetta 2 — pays a
# 25-40× inference latency penalty for llama.cpp AVX2 → NEON translation.

# ── Debian/Ubuntu architecture tag ──
ARCH=arm64

# ── Rust target triple ──
# Used by: cargo build --target= via the `cross` crate on an amd64
# build host, or native `cargo build --release` on an arm64 host.
RUST_TRIPLE=aarch64-unknown-linux-gnu

# ── GRUB EFI format + boot filename ──
# BOOTAA64.EFI is the UEFI-defined default name on aarch64.
GRUB_FORMAT=arm64-efi
EFI_BOOT_NAME=BOOTAA64.EFI

# ── QEMU emulator + machine + firmware ──
# arm64 has no fixed "PC" chipset. `virt` is the QEMU-defined generic
# virtualization board (supports UEFI + virtio + a range of ARMv8 CPUs).
# cortex-a72 is a mid-range ARMv8-A CPU with NEON — safe generic default
# for TCG. UTM Virtualize on M-series ignores QEMU_CPU_TCG entirely
# because it uses Apple's Virtualization.framework, which passes native
# host CPU features through.
QEMU_BIN=qemu-system-aarch64
QEMU_MACHINE="virt"
QEMU_FW_ARGS="-bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd"
QEMU_CPU_TCG="cortex-a72"

# ── APT mirror ──
# arm64 is a "ports" architecture (secondary; not on primary mirrors).
# Ubuntu keeps it on ports.ubuntu.com.
APT_MIRROR=http://ports.ubuntu.com/ubuntu-ports

# ── llama.cpp cmake flags + build directory ──
# NEON is baseline in ARMv8-A (mandatory since 2011) — no explicit flag
# needed. Metal is macOS-only (not available on Linux); we skip it.
# CUDA is x86_64-only in llama.cpp; skip.
LLAMA_CMAKE_FLAGS="-DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a -DGGML_METAL=OFF -DGGML_CUDA=OFF"
LLAMA_BUILD_DIR=build-arm64

# ── ISO boot mode ──
# arm64 has no BIOS path — UEFI only. GRUB EFI is what UTM's
# Virtualization.framework boots directly.
BOOT_MODE=uefi-only
