# /etc/icebreaker/controller.toml — system defaults.
# User overrides: ~/.config/icebreaker/controller.toml (load_layered, ADR-8).

[qb]
# Default: Gemini Flash for QB (intent parsing). The local PB model
# (Qwen 1.5B) lacks capacity for reliable intent parsing — Gemini
# provides the best cost/quality tradeoff. Requires internet + API key.
# For offline operation, set backend = "local" and run a local QB server.
backend = "gemini"

[qb.gemini]
# Model choice — swap via Control Center → Models page, or edit here.
# Supported presets: gemini-2.5-flash (default, fast), gemini-2.5-pro
# (higher-quality reasoning), gemini-2.0-flash (older but stable).
# Ceiling in schema is 1M tokens / 2h timeout — v6.65 raised both so
# users tuning for long-running workflows aren't blocked.
model           = "gemini-2.5-flash"
api_key_env     = "GEMINI_API_KEY"
# v6.9 (2026-07-17, Bug H, Task #155): 8192 → 50000. Gemini 2.5 Flash's
# built-in reasoning ("thinking") counts against max_output_tokens.
# For multi-step Plan mode (Task #148) with 2-4 steps, thinking often
# uses 6-8k tokens leaving <1k for the actual output — response
# truncates mid-JSON → BrainTruncationError. 50000 is the same value
# commit 870231d used for live tests. Ceiling is 1M via Control Center.
# F-53 v6.65 history: 512 → 2048 → 8192 → 50000.
max_tokens      = 50000
timeout_seconds = 60

# Alternate backends — uncomment + fill in to switch:
# [qb.anthropic]
# model           = "claude-sonnet-4-6"
# api_key_env     = "ANTHROPIC_API_KEY"
# max_tokens      = 8192
# timeout_seconds = 60
#
# [qb.openai]
# model           = "gpt-5-mini"
# api_key_env     = "OPENAI_API_KEY"
# max_tokens      = 8192
# timeout_seconds = 60

[run]
mcpd_binary        = "/usr/libexec/icebreaker/mcpd"
mcpd_schemas_dir   = "/usr/share/icebreaker/schemas"
audit_log          = "/var/log/icebreaker/controller-audit.log"
pb_endpoint        = "unix:///run/icebreaker/pbd.sock"
pb_transport       = "unix"
pb_model_id        = "qwen-2.5-coder-1.5b-instruct-q4_k_m"
# v6.16 M7.0.2 (2026-08-06): explicit belt-and-braces path to the
# GBNF grammar file. When set, controller-side LlamaCppLocalBackend
# threads `grammar` into the payload it sends to llama-server —
# constraint enforced client-side AND server-side (start-pbd --grammar-file).
# Whitepaper §6 mandate — see F-110 in incremental/GROUND_TRUTH.md § 7.
# Ships to this path via incremental/versions/v6.manifest Step 1b;
# runtime absence surfaces as first-boot phase_result "pb_grammar" warn.
pb_grammar_path    = "/var/lib/icebreaker/grammars/mcp_tool_call.gbnf"
# v6.65: bumped 256 → 1024. PB emits structured tool-call JSON that
# rarely exceeds 200 tokens in practice, but headroom prevents
# truncation on write intents with long content payloads.
pb_max_tokens      = 1024
# F-25: generous for emulated x86 (Apple Silicon / Rosetta 2 runs Qwen 1.5B
# at ~2-5 min/turn). Native x86 or ARM64 does the same in <5 s; drop to 30 s
# on real hardware via ~/.config/icebreaker/controller.toml layered override.
pb_timeout_seconds = 600
# F-30: mcpd's fs.rs canonicalize fallback under Rosetta emulation runs
# slower than the 10 s default; give it 120 s of headroom.
mcpd_timeout_seconds = 120.0
# Phase 6 Scope B — was a hardcoded 600.0 s in client.py. Same F-25
# rationale: Rosetta 2 needs headroom; native completes in seconds.
# Change in Control Center → Models → Advanced timings, or here.
turn_timeout_seconds = 600.0
# Hardware probe subprocess timeout (sysctl / nvidia-smi / rocm-smi). Was
# a magic 5 s. Raise if you're on slow VM disks / encrypted rootfs.
model_probe_timeout_seconds = 5.0

[paths]
catalogue_path    = "/usr/share/icebreaker/catalogue.toml"
model_search_dirs = ["/var/lib/icebreaker/models", "~/.local/share/icebreaker/models"]

# F-28: extra filesystem read roots for mcpd. mcpd's built-in allowlist is
# STATIC_ROOTS (/proc /sys /tmp /var/log /etc) + $HOME. Under systemd the
# controller daemon has an empty $HOME so /home/<user> is not in the default
# allowlist. Add each ISO user's home directly. Landlock enforces the same
# list at the kernel level (defense in depth).
[mcpd.fs]
read_roots = ["/home/icebreaker"]

[prompts]
prompts_dir = "/usr/share/icebreaker/prompts"

[session]
ephemeral_history = true
show_spinner      = true
show_progress     = true
stream_output     = true
color             = "auto"
# Phase 6 Scope B — shell-context caps (previously hardcoded module
# constants in session.py). Change in Control Center → Limits, or here.
max_shell_context_chars = 512
max_recent_commands     = 5

[hitl]
lockout_seconds = 3
# v6.12 hotfix (2026-07-23): bumped 30 → 300 (5 min). 30s is well below
# human decision-time for a Tier-2/3 prompt — the user is reading the
# target path, checking the CoW preview, sometimes tabbing between
# windows. If they answered ~1s after the 30s mark, the daemon had
# already timed out (auto-deny) and their 'approved' arrived at a stale
# waiter, silently dropped. 300s matches sudo's default `timestamp_timeout`.
timeout_seconds = 300

[daemon]
socket_path     = "/run/icebreaker/controller.sock"
pid_file        = "/run/icebreaker/controller.pid"
# v6.65: 1 → 4. Users need the Icebreaker Terminal + Control Center +
# ib-debug diagnostics + occasional GNOME chatbot to all connect
# simultaneously. Bumping to 4 makes the daemon serve real workflows.
max_connections = 4
# Phase 6 Scope B — client-transport tuning (previously hardcoded in
# client.py). reader_recv_timeout balances CPU vs. notification latency;
# max_reconnect_delay caps the exponential-backoff wait after a socket
# drop. Both take effect only on daemon (client) restart.
reader_recv_timeout_seconds  = 1.0
max_reconnect_delay_seconds  = 30.0

# v6.10 Track A (2026-07-17): AgentGraph pipeline (v6.8 Tasks #146-#150)
# is ON by default. responder_node now QB-summarises the last step's
# tool output (mirrors Controller._qb_summarise) so TurnResult.output
# populates end-to-end. Compound intents (Plan mode from Task #148),
# cross-turn pronouns (Task #149 recent_turns), single-turn Tier 0 —
# all route through this pipeline. Set enabled=false via config
# override only for A/B bisecting a regression against the monolithic
# path. Full LangGraph astream_events token streaming still lands
# under Task #151 as a follow-up.
[agent_graph]
enabled = true
