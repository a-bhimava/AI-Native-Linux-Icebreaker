# Enabled only by the user-session helper after its X11/GLX check.
backend = "glx";
vsync = true;
detect-client-opacity = true;
use-damage = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
# Icebreaker windows stay opaque; never use opacity/corner rules that could
# make a HITL or audit window translucent.
opacity-rule = [ ];
