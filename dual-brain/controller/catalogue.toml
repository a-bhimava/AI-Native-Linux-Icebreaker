# ─── Cloud QB presets (Phase 6 Scope C) ────────────────────────────────────
#
# Every entry is a QB model presented in the Control Center → Models
# dropdown. `id` is the exact string sent to the provider SDK.
# `status` is grounded in live verification (models.retrieve metadata
# endpoint, non-billable) at catalogue-authoring time (2026-07-10).
#
# The Models page renders these grouped by `provider`, in the order
# they appear here. Users can override via `~/.config/icebreaker/
# presets.toml` — but arrays REPLACE rather than concatenate on merge
# (the deep-merge trap; otherwise a malicious overlay could silently
# add a preset).


# ── Google Gemini ──────────────────────────────────────────────────────────

