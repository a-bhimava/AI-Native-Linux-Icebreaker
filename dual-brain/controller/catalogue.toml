# Icebreaker model catalogue.
#
# Authoritative list of supported QB / PB / draft models. The Controller
# never sees a filename in code — it only sees `model_id`, and looks up
# the on-disk file via this catalogue + the model_registry resolver.
#
# This file is the MENU. The receipt of what was actually downloaded
# and checksum-verified lives in `models/checksums.sha256`, written by
# `python3 -m controller.model_registry install`.
#
# Source URLs point to trusted GGUF mirrors. Each entry's `license`
# field controls whether `install` requires `--accept-license` before
# downloading (any license that's not in ALLOW_LIST_LICENSES requires
# explicit acceptance).
#
# Schema version bumps must be coordinated with model_registry.py's
# parser; bump on any breaking field change.

schema_version = "1"


# ─── QB candidates ──────────────────────────────────────────────────────────

[[model]]
id = "qwen-2.5-1.5b-instruct-q4_k_m"
