# /etc/sysusers.d/icebreaker.conf — service users and group.
#
# Creates system users for PB and QB inference servers plus a shared
# group for socket access. See sysusers.d(5).
#
# Users have no home directory and no login shell — they exist only to
# own the llama-server processes and the UNIX sockets in /run/icebreaker/.

# Group: socket access for pbd/qbd/controller + first interactive user.
g icebreaker-users -

# Service users (nologin, no home).
u _icebreaker_pb - "Icebreaker Privileged Brain" /nonexistent /usr/sbin/nologin
u _icebreaker_qb - "Icebreaker Quarantined Brain" /nonexistent /usr/sbin/nologin

# Add service users to the shared group.
m _icebreaker_pb icebreaker-users
m _icebreaker_qb icebreaker-users
