# /etc/tmpfiles.d/icebreaker.conf — runtime directory for Icebreaker.
#
# Creates /run/icebreaker/ with setgid bit (2775) so that pbd, qbd, and
# the controller can share UNIX sockets. Owned by root:icebreaker-users.
#
# See tmpfiles.d(5).

d /run/icebreaker 2775 root icebreaker-users -
d /var/log/icebreaker 2775 root icebreaker-users -
# F-99 (2026-07-27): /var/log/mcpd must be writable by the interactive
# user because in OC edition mcpd is spawned by opencode (running as the
# icebreaker user via mcpd-for-oc.sh), not by the controller service.
# root:icebreaker-users 2775 with setgid so new files inherit the group.
# Without this, mcpd's audit writes silently fail (audit mutex poisoned
# in mcpd's own log) → oc_audit_bridge has nothing to enrich → INV-8 is
# silently broken for the primary OC-edition use case.
#
# tmpfiles.d runs at boot BEFORE any service starts, so the controller
# service's LogsDirectory=mcpd effectively becomes a no-op (dir already
# exists with the perms we want). Harmless in current-edition where the
# dir sits empty when no OC-side mcpd is spawned.
d /var/log/mcpd 2775 root icebreaker-users -
