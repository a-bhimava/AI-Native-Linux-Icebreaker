[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icebreaker-controller"
version = "0.6.0"
description = "Icebreaker AI-Native OS Controller"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20,<5",
    "requests>=2.31",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "prompt-toolkit>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
icebreaker = "controller.__main__:main"

[tool.setuptools.packages.find]
include = ["controller*"]
