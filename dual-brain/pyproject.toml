[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icebreaker-controller"
version = "0.6.1"
description = "Icebreaker AI-Native OS Controller"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20,<5",
    "jsonschema[format-nongpl]>=4.20,<5",
    "attrs>=23.1",
    "requests>=2.31",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    # v6.8 N.2.a (2026-07-13): LiteLLM unifies the QB provider transport.
    # PB (backends/llama_local_backend.py) stays direct via llama-server HTTP.
    # v1.44+ is required for context-aware fallback (strips incompatible
    # params like response_format when routing to a different provider).
    "litellm>=1.44,<2.0",
    # v6.8 Task #146 (2026-07-13): LangGraph runtime for plan-and-execute
    # orchestration. 1.2.x is current stable; verified installs clean with
    # our existing deps (litellm, pydantic 2.x). Checkpoint-sqlite provides
    # SqliteSaver for durable execution (§13.1 CVE mitigation via
    # allowed_msgpack_modules allowlist).
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "prompt-toolkit>=3.0",
    "textual>=0.80",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "tomli-w>=1.0",
    # v6.9 Scope O Layer 1 (2026-07-14): tool_catalogue.yaml is the single
    # source for prompts + tests + risk classifier; export_mcpd_catalogue.py
    # loads it via yaml.safe_load.
    "PyYAML>=6.0",
]

[project.scripts]
icebreaker = "controller.__main__:main"

[tool.setuptools.packages.find]
include = ["controller*", "terminal*", "gui*", "gui_agent*", "rpa_bridge*"]

[tool.setuptools.package-data]
terminal = ["*.tcss"]
gui = ["*.css", "*.ui"]

[project.optional-dependencies]
gui = [
    "PyGObject>=3.42",
    "websockets>=12.0",
]
rpa = [
    "robotframework>=7.0",
    "rpaframework>=28.0",
    "Pillow>=10.0",
    "numpy>=1.26",
]
# v6.8 Task #146: LangSmith tracing available in DEV builds only. Release
# ISOs are shipped WITHOUT this extra so `import langsmith` fails cleanly
# in production. Enabled via `pip install .[dev]` on developer machines.
dev = [
    "langsmith>=0.3,<1.0",
]
