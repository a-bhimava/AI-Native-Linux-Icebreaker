[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icebreaker-controller"
version = "0.6.1"
description = "Icebreaker AI-Native OS Controller"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20,<5",
    "jsonschema[format-nongpl]>=4.20,<5",
    "attrs>=23.1",
    "requests>=2.31",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "prompt-toolkit>=3.0",
    "textual>=0.80",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "tomli-w>=1.0",
]

[project.scripts]
icebreaker = "controller.__main__:main"

[tool.setuptools.packages.find]
include = ["controller*", "terminal*", "gui*", "gui_agent*", "rpa_bridge*"]

[tool.setuptools.package-data]
terminal = ["*.tcss"]
gui = ["*.css", "*.ui"]

[project.optional-dependencies]
gui = [
    "PyGObject>=3.42",
    "websockets>=12.0",
]
rpa = [
    "robotframework>=7.0",
    "rpaframework>=28.0",
    "Pillow>=10.0",
]
