# Phase 6 Scope B allowlist for `no_new_knobs.py`.
#
# Every entry MUST carry a `reason = "..."` field. New entries added
# without a justification are a review signal — "should this be a
# user-tunable config field instead of a hardcoded constant?"
#
# When the review answer is YES (the constant governs user-observable
# behavior), migrate it to controller_config.json and delete the entry
# here rather than allowlisting.
#
# Baseline captured 2026-07-10 against the tree post-Scope A + Scope B
# Step 1-3. Do NOT add new entries without a justification — the
# no_new_knobs.py CI gate (G23) enforces this.

# ── Safety-critical constants that must not be user-tunable ────────────

[[knob]]
file   = "controller/intent_schema.py"
name   = "_RECEIVED_MAX_LEN"
reason = "Intent JSON size cap. Widening this expands INV-1 blast radius on prompt injection; must not be user-tunable."

